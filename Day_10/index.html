<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Country Explorer</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px auto;
        max-width: 900px;
        padding: 0 16px;
        color: #111;
      }

      h1 {
        font-size: 1.6rem;
        margin-bottom: 4px;
      }

      p.subtitle {
        color: #666;
        margin-top: 0;
        margin-bottom: 20px;
        font-size: 0.9rem;
      }

      .search-bar {
        margin-bottom: 20px;
      }

      #searchInput {
        width: 100%;
        padding: 10px 12px;
        font-size: 1rem;
        border: 1px solid #999;
        border-radius: 4px;
        box-sizing: border-box;
      }

      #status {
        padding: 12px 0;
        color: #555;
        font-style: italic;
      }

      #status.error {
        color: #900;
        font-style: normal;
        font-weight: bold;
      }

      .country-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 16px;
      }

      .country-card {
        border: 1px solid #ddd;
        border-radius: 6px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .country-card img {
        width: 100%;
        height: 110px;
        object-fit: cover;
        display: block;
        background: #f2f2f2;
      }

      .country-card-body {
        padding: 10px 12px;
      }

      .country-name {
        font-size: 0.95rem;
        font-weight: bold;
        margin: 0 0 6px;
      }

      .country-detail {
        font-size: 0.8rem;
        color: #555;
        margin: 2px 0;
      }

      .empty-state {
        padding: 20px;
        text-align: center;
        color: #666;
        font-style: italic;
      }

      button#retryBtn {
        padding: 6px 14px;
        border: 1px solid #900;
        background: #fee;
        color: #900;
        border-radius: 4px;
        cursor: pointer;
        margin-left: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Country Explorer</h1>
    <p class="subtitle">
      Live data from
      <a href="https://restcountries.com" target="_blank" rel="noopener">REST Countries API</a>
    </p>

    <div class="search-bar">
      <input
        type="text"
        id="searchInput"
        placeholder="Search by country name or region..."
        autocomplete="off"
      />
    </div>

    <div id="status">Loading countries...</div>
    <div class="country-grid" id="countryGrid"></div>

    <script src="./script.js"></script>
  </body>
</html>
